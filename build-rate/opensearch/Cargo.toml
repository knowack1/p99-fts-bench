[package]
name = "osrate"
version = "0.1.0"
edition = "2021"
description = "Concurrency sweep for OpenSearch ingest: docs/s and p99 per concurrency level"
publish = false

[[bin]]
name = "osrate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
bytes = "1.10.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
opensearch = { version = "2.4.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.24.0"

[features]
default = ["tls"]
# An `https://` endpoint. Pure-Rust TLS rather than the crate's own default,
# which is native-tls: a run must not depend on the box's OpenSSL. The bench's
# own compose files publish plain HTTP, so `--no-default-features` builds a
# smaller binary that reaches them and nothing else.
tls = ["opensearch/rustls-tls"]

[profile.release]
debug = false
